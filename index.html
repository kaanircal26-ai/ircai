
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Tozra — Yapay Zekâ</title>

<style>
:root {
  --bg: #ffffff;
  --surface: #f8f9fb;
  --border: #e9eaf0;
  --text: #17181c;
  --muted: #858894;
  --accent: #635bff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 260px;
  border-right: 1px solid var(--border);
  padding: 25px 18px;
  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 25px;
  font-weight: 750;
  letter-spacing: -1.3px;
  margin-bottom: 35px;
}

.logo span {
  color: var(--accent);
}

.new-chat {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 13px;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
  text-align: left;
}

.sidebar-bottom {
  margin-top: auto;
  color: var(--muted);
  font-size: 12px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 70px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
}

.topbar-title {
  font-size: 14px;
  font-weight: 600;
}

.status {
  color: #159b69;
  font-size: 12px;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 35px 20px;
}

.welcome {
  max-width: 680px;
  margin: 12vh auto 0;
  text-align: center;
}

.welcome h1 {
  font-size: clamp(30px, 5vw, 43px);
  letter-spacing: -2px;
  margin-bottom: 12px;
}

.welcome h1 span {
  color: var(--accent);
}

.welcome p {
  color: var(--muted);
  font-size: 15px;
}

.messages {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.message {
  display: flex;
  flex-direction: column;
  gap: 8px;
  line-height: 1.7;
  font-size: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user {
  align-items: flex-end;
}

.message.user .content {
  background: #f0efff;
  padding: 12px 17px;
  border-radius: 16px;
  max-width: 85%;
}

.message.assistant .content {
  max-width: 100%;
}

.message-label {
  font-size: 11px;
  color: var(--muted);
}

.composer-wrap {
  padding: 15px 20px 25px;
}

.composer {
  max-width: 760px;
  margin: auto;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 13px;
  box-shadow: 0 5px 25px rgba(0,0,0,.04);
}

.composer textarea {
  width: 100%;
  resize: none;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 15px;
  min-height: 45px;
  max-height: 150px;
  padding: 8px;
  color: var(--text);
}

.composer-bottom {
  display: flex;
  justify-content: flex-end;
}

.send {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 11px;
  padding: 10px 18px;
  cursor: pointer;
  font-weight: 600;
}

.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 12px;
}

@media(max-width:700px) {
  .sidebar { display: none; }
  .topbar { padding: 0 18px; }
  .chat-area { padding: 20px 15px; }
  .welcome { margin-top: 15vh; }
  .composer-wrap { padding: 12px; }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">tozra<span>.</span></div>
    <button class="new-chat" onclick="newChat()">
      + Yeni sohbet
    </button>
    <div class="sidebar-bottom">
      Tozra AI · Creative Intelligence
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="topbar-title">Tozra AI</div>
      <div class="status">● Sistem hazır</div>
    </header>

    <section class="chat-area" id="chatArea">

      <div class="welcome" id="welcome">
        <h1>Merhaba, <span>nasıl yardımcı olabilirim?</span></h1>
        <p>Fikirlerini geliştir. Sorularını sor. Yeni şeyler keşfet.</p>
      </div>

      <div class="messages" id="messages"></div>

    </section>

    <div class="composer-wrap">

      <div class="composer">
        <textarea
          id="prompt"
          placeholder="Tozra'ya bir şey sor..."
          rows="1"
        ></textarea>

        <div class="composer-bottom">
          <button class="send" id="sendButton" onclick="sendMessage()">
            Gönder ↑
          </button>
        </div>
      </div>

      <div class="disclaimer">
        Tozra yapay zekâ tarafından oluşturulan cevaplarda hata yapabilir.
      </div>

    </div>

  </main>
</div>

<script>
const promptInput = document.getElementById("prompt");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const chatArea = document.getElementById("chatArea");
const sendButton = document.getElementById("sendButton");

let history = [];
let busy = false;

function addMessage(role, text) {
  welcome.style.display = "none";

  const message = document.createElement("div");
  message.className = "message " + role;

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = role === "user" ? "Sen" : "Tozra";

  const content = document.createElement("div");
  content.className = "content";
  content.textContent = text;

  message.appendChild(label);
  message.appendChild(content);
  messages.appendChild(message);

  chatArea.scrollTop = chatArea.scrollHeight;

  return content;
}

async function sendMessage() {
  const prompt = promptInput.value.trim();

  if (!prompt || busy) return;

  busy = true;
  sendButton.disabled = true;

  addMessage("user", prompt);
  promptInput.value = "";

  const answer = addMessage("assistant", "Yanıt hazırlanıyor...");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt,
        history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Sunucu hatası.");
    }

    if (!data.answer) {
      throw new Error("Yapay zekâ boş yanıt verdi.");
    }

    answer.textContent = data.answer;

    history.push(
      { role: "user", content: prompt },
      { role: "assistant", content: data.answer }
    );

  } catch (error) {
    answer.textContent = "Bağlantı hatası: " + error.message;
  }

  busy = false;
  sendButton.disabled = false;
  promptInput.focus();
}

function newChat() {
  history = [];
  messages.innerHTML = "";
  welcome.style.display = "block";
  promptInput.value = "";
}

promptInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
