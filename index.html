<style>

<script>
const $=id=>document.getElementById(id);
const promptInput=$("prompt"),sendButton=$("send");
const messagesEl=$("messages"),welcomeEl=$("welcome");
const historyEl=$("history");

let conversation=[],conversations=[],busy=false,attachments=[];

function saveConversation(){
  if(!conversation.length)return;
  const id=conversation[0].id||Date.now();
  const item={
    id,
    title:conversation.find(m=>m.role==="user")?.content.slice(0,35)||"Yeni sohbet",
    messages:conversation
  };
  const index=conversations.findIndex(x=>x.id===id);
  if(index>=0)conversations[index]=item;
  else conversations.unshift(item);
  try{localStorage.setItem("tozra-conversations",JSON.stringify(conversations))}catch(e){}
  renderHistory();
}

function loadHistory(){
  try{
    const data=JSON.parse(localStorage.getItem("tozra-conversations")||"[]");
    conversations=Array.isArray(data)?data:[];
  }catch(e){conversations=[]}
  renderHistory();
}

function renderHistory(){
  historyEl.innerHTML="";
  conversations.forEach(item=>{
    const button=document.createElement("div");
    button.className="history-item";
    button.textContent=item.title||"Sohbet";
    button.onclick=()=>{
      conversation=Array.isArray(item.messages)?item.messages:[];
      renderMessages();
      $("sidebar").classList.remove("open");
    };
    historyEl.appendChild(button);
  });
}

function renderMessages(){
  messagesEl.innerHTML="";
  welcomeEl.style.display=conversation.length?"none":"block";
  conversation.forEach(m=>addMessageToScreen(m.role,m.content));
}

function addMessageToScreen(role,content){
  const wrapper=document.createElement("div");
  wrapper.className="message "+role;
  const label=document.createElement("div");
  label.className="message-label";
  label.textContent=role==="user"?"SEN":"TOZRA";
  const text=document.createElement("div");
  text.className="message-text";
  text.textContent=content;
  wrapper.append(label,text);

  if(role==="assistant"){
    const copy=document.createElement("button");
    copy.className="copy-button";
    copy.textContent="Kopyala";
    copy.onclick=async()=>{
      try{
        await navigator.clipboard.writeText(content);
        copy.textContent="Kopyalandı";
      }catch(e){copy.textContent="Kopyalanamadı"}
    };
    wrapper.appendChild(copy);
  }
  messagesEl.appendChild(wrapper);
  wrapper.scrollIntoView({behavior:"smooth",block:"end"});
}

function renderAttachments(){
  const area=$("attachments");
  area.innerHTML="";
  attachments.forEach((a,index)=>{
    const item=document.createElement("div");
    item.className="attachment";
    if(a.kind==="image"){
      const img=document.createElement("img");
      img.src=a.url;item.appendChild(img);
    }else{
      const video=document.createElement("video");
      video.src=a.url;video.muted=true;item.appendChild(video);
    }
    const name=document.createElement("span");
    name.textContent=a.file.name.slice(0,18);
    item.appendChild(name);
    const remove=document.createElement("button");
    remove.className="remove-file";
    remove.textContent="×";
    remove.onclick=()=>{
      URL.revokeObjectURL(a.url);
      attachments.splice(index,1);
      renderAttachments();
    };
    item.appendChild(remove);
    area.appendChild(item);
  });
}

function addFiles(files,kind){
  const selected=Array.from(files);
  if(attachments.length+selected.length>3){
    alert("Bir mesajda en fazla 3 dosya ekleyebilirsin.");
    return;
  }

  for(const file of selected){
    if(kind==="image"&&!["image/jpeg","image/png","image/webp"].includes(file.type)){
      alert("JPG, PNG veya WEBP fotoğraf seç.");
      continue;
    }
    if(kind==="video"&&!file.type.startsWith("video/")){
      alert("Geçerli bir video seç.");
      continue;
    }
    if(file.size>40*1024*1024){
      alert("Dosya boyutu 40 MB sınırını aşıyor.");
      continue;
    }
    attachments.push({file,kind,url:URL.createObjectURL(file)});
  }
  renderAttachments();
}

function clearAttachments(){
  attachments.forEach(a=>URL.revokeObjectURL(a.url));
  attachments=[];
  renderAttachments();
}

// Fotoğrafı küçültüp Base64 formatına dönüştürür.
function imageToDataURL(file,maxSide=1100,quality=.72){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);

    img.onload=()=>{
      const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));

      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);

      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg",quality));
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("Fotoğraf okunamadı."));
    };

    img.src=url;
  });
}

// Saniyeyi dakika:saniye biçimine dönüştürür.
function formatTime(seconds){
  const safe=Math.max(0,Math.floor(seconds));
  const minutes=Math.floor(safe/60);
  const remaining=safe%60;
  return String(minutes).padStart(2,"0")+":"+String(remaining).padStart(2,"0");
}

// Videodan kronolojik sırayla 3 örnek kare çıkarır.
function videoToFrames(file,count=3){
  return new Promise((resolve,reject)=>{
    const video=document.createElement("video");
    const url=URL.createObjectURL(file);

    video.preload="auto";
    video.muted=true;
    video.playsInline=true;

    let finished=false;

    const finish=()=>{
      if(finished)return;
      finished=true;
      video.onloadeddata=null;
      video.onseeked=null;
      video.onerror=null;
      URL.revokeObjectURL(url);
      video.removeAttribute("src");
      video.load();
    };

    video.onerror=()=>{
      finish();
      reject(new Error("Video okunamadı. Başka bir video dosyası dene."));
    };

    video.onloadeddata=async()=>{
      try{
        const duration=video.duration;

        if(!Number.isFinite(duration)||duration<=0){
          throw new Error("Video süresi okunamadı.");
        }

        const fractions=count===1
          ?[0.5]
          :count===2
            ?[0.2,0.8]
            :[0.1,0.5,0.9];

        const times=[];
        for(const fraction of fractions){
          const target=Math.min(
            duration* fraction,
            Math.max(0,duration-0.05)
          );

          if(!times.some(t=>Math.abs(t-target)<0.05)){
            times.push(target);
          }
        }

        const frames=[];

        for(const target of times){
          await new Promise((resolveSeek,rejectSeek)=>{
            let settled=false;

            const cleanup=()=>{
              clearTimeout(timer);
              video.removeEventListener("seeked",onSeeked);
            };

            const done=()=>{
              if(settled)return;
              settled=true;
              cleanup();
              resolveSeek();
            };

            const fail=()=>{
              if(settled)return;
              settled=true;
              cleanup();
              rejectSeek(new Error("Video karesi alınamadı."));
            };

            const onSeeked=()=>done();
            const timer=setTimeout(fail,12000);

            video.addEventListener("seeked",onSeeked,{once:true});

            try{
              video.currentTime=target;
              if(Math.abs(video.currentTime-target)<0.01&&video.readyState>=2){
                done();
              }
            }catch(error){
              fail();
            }
          });

          if(!video.videoWidth||!video.videoHeight){
            throw new Error("Videonun görüntü boyutları okunamadı.");
          }

          const scale=Math.min(
            1,
            640/Math.max(video.videoWidth,video.videoHeight)
          );

          const canvas=document.createElement("canvas");
          canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
          canvas.height=Math.max(1,Math.round(video.videoHeight*scale));

          const ctx=canvas.getContext("2d");
          if(!ctx)throw new Error("Video karesi işlenemedi.");

          ctx.drawImage(video,0,0,canvas.width,canvas.height);

          frames.push({
            data:canvas.toDataURL("image/jpeg",.55),
            time:target
          });
        }

        finish();

        resolve({
          frames,
          duration,
          name:file.name
        });

      }catch(error){
        finish();
        reject(error);
      }
    };

    video.src=url;
    video.load();
  });
}

// Fotoğraf ve videoları hazırlar.
// Video karelerinin zaman bilgilerini analiz metnine ekler.
async function prepareMedia(){
  const images=[];
  const videoFrames=[];
  const timeline=[];

  for(const item of attachments){
    if(item.kind==="image"){
      images.push(await imageToDataURL(item.file));
    }
  }

  for(const item of attachments){
    if(item.kind==="video"){
      const remaining=3-images.length-videoFrames.length;

      if(remaining<=0)break;

      const result=await videoToFrames(
        item.file,
        Math.min(3,remaining)
      );

      timeline.push({
        name:result.name,
        duration:result.duration,
        frames:result.frames.map((frame,index)=>({
          index:index+1,
          time:frame.time
        }))
      });

      videoFrames.push(...result.frames.map(frame=>frame.data));
    }
  }

  if(images.length+videoFrames.length>3){
    throw new Error("Bir istekte en fazla 3 görüntü gönderilebilir.");
  }

  let timelineText="";

  if(timeline.length){
    timelineText="\n\n[VİDEO ANALİZİ - KRONOLOJİK KARELER]\n";

    timeline.forEach(video=>{
      timelineText+=
        "\nVideo dosyası: "+video.name+
        "\nVideo süresi: "+video.duration.toFixed(2)+" saniye\n";

      video.frames.forEach(frame=>{
        timelineText+=
          "Kare "+frame.index+
          ": "+formatTime(frame.time)+
          " zamanında alınmıştır.\n";
      });
    });

    timelineText+=`
    
ANALİZ TALİMATI:
- Kareleri yukarıdaki zaman sırasına göre incele.
- İlk kareyi başlangıç, sonraki kareleri gelişim ve son kareyi videonun ilerleyen bölümü olarak değerlendir.
- Kareler arasında görülebilen değişimleri karşılaştır.
- Nesnelerin veya kişilerin konum değişikliklerini yalnızca görüntüden anlaşılabildiği ölçüde açıkla.
- Olayların muhtemel sırasını kronolojik olarak anlat.
- Görüntülerde bulunmayan hareketleri veya olayları uydurma.
- Sadece örnek karelerin gösterdiği bilgileri kullan.
- Videonun tamamını veya sesini analiz ettiğini iddia etme.
- Sonunda kısa ve anlaşılır bir video özeti oluştur.
`;
  }

  return {
    images,
    videoFrames,
    timelineText
  };
}

async function sendMessage(value){
  const text=(value??promptInput.value).trim();

  if((!text&&!attachments.length)||busy)return;

  if(!text&&attachments.length){
    alert("Dosyanı analiz edebilmem için ne yapmamı istediğini de yaz.");
    return;
  }

  busy=true;
  sendButton.disabled=true;
  welcomeEl.style.display="none";

  const fileNames=attachments.map(a=>a.file.name);
  const displayText=text+
    (fileNames.length?"\n\nEklenen dosyalar: "+fileNames.join(", "):"");

  if(!conversation.length){
    conversation.push({
      id:Date.now(),
      role:"user",
      content:displayText
    });
  }else{
    conversation.push({
      role:"user",
      content:displayText
    });
  }

  addMessageToScreen("user",displayText);

  promptInput.value="";
  promptInput.style.height="38px";

  const typing=document.createElement("div");
  typing.className="typing";
  typing.textContent="TOZRA görüntüleri analiz ediyor...";
  messagesEl.appendChild(typing);

  try{
    const media=await prepareMedia();

    const analysisPrompt=text+media.timelineText;

    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        prompt:analysisPrompt,
        history:conversation.slice(0,-1),
        images:media.images,
        videoFrames:media.videoFrames
      })
    });

    let data;

    try{
      data=await response.json();
    }catch(e){
      throw new Error("Sunucudan geçerli yanıt alınamadı.");
    }

    if(!response.ok||!data.success){
      throw new Error(data.error||"Yapay zekâ yanıt veremedi.");
    }

    const answer=data.answer||"Bir yanıt oluşturulamadı.";

    conversation.push({
      role:"assistant",
      content:answer
    });

    typing.remove();
    addMessageToScreen("assistant",answer);
    saveConversation();
    clearAttachments();

  }catch(error){
    typing.remove();

    const message=
      "İstek tamamlanamadı: "+
      (error.message||"Bir bağlantı sorunu oluştu.");

    conversation.push({
      role:"assistant",
      content:message
    });

    addMessageToScreen("assistant",message);
    saveConversation();
    console.error(error);

  }finally{
    busy=false;
    sendButton.disabled=false;
  }
}

function newChat(){
  conversation=[];
  messagesEl.innerHTML="";
  welcomeEl.style.display="block";
  promptInput.value="";
  clearAttachments();
  $("sidebar").classList.remove("open");
}

function addLink(){
  const url=prompt("Eklemek istediğin bağlantıyı yaz:");
  if(!url)return;

  let parsed;

  try{
    parsed=new URL(url);
  }catch(e){
    alert("Lütfen geçerli bir bağlantı gir.");
    return;
  }

  if(!["http:","https:"].includes(parsed.protocol)){
    alert("Yalnızca http veya https bağlantıları kullanılabilir.");
    return;
  }

  promptInput.value+=
    (promptInput.value?"\n":"")+"Bağlantı: "+parsed.href;

  promptInput.focus();

  alert("Bağlantı mesajına eklendi. Bağlantı içeriğinin okunması için ayrıca backend desteği gerekir.");
}
