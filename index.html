
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRCAI — Ideas Into Reality</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090d;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{height:75px;border-bottom:1px solid #20212a;display:flex;align-items:center;justify-content:space-between;padding:0 7%}
.logo{font-size:26px;font-weight:800;letter-spacing:3px}
.logo span{color:#9c8aff}
nav{color:#999;font-size:13px}
main{max-width:850px;margin:100px auto;padding:20px;text-align:center}
.tag{color:#a899ff;font-size:12px;letter-spacing:3px;margin-bottom:25px}
h1{font-size:clamp(38px,8vw,68px);line-height:1.1;margin-bottom:22px}
h1 span{color:#a899ff}
.desc{color:#999;line-height:1.7;margin-bottom:40px}
.panel{background:#11121a;border:1px solid #292a38;border-radius:18px;padding:22px;text-align:left}
textarea{width:100%;height:130px;background:transparent;border:0;outline:0;color:white;font-size:16px;resize:vertical}
textarea::placeholder{color:#777}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:10px}
small{color:#777}
button{background:#a899ff;color:#090910;border:0;border-radius:10px;padding:14px 22px;font-weight:bold;cursor:pointer}
button:hover{background:#c0b5ff}
#result{display:none;margin-top:25px;padding:22px;background:#141520;border:1px solid #39334f;border-radius:15px;text-align:left;line-height:1.7;white-space:pre-wrap}
footer{margin-top:90px;color:#555;font-size:12px}
</style>
</head>
<body>
<header>
<div class="logo">IRC<span>AI</span></div>
<nav>AI CREATIVE PLATFORM</nav>
</header>
<main>
<div class="tag">YOUR IDEAS. UNLIMITED POSSIBILITIES.</div>
<h1>Fikrini <span>gerçeğe</span><br> dönüştür.</h1>
<p class="desc">Aklındaki fikri anlat. IRCAI onu geliştirmen için sana yol göstersin.</p>
<div class="panel">
<textarea id="idea" placeholder="Aklındaki projeyi buraya anlat..."></textarea>
<div class="bottom">
<small>IRCAI • IDEA ENGINE</small>
<button onclick="createIdea()">Fikrimi geliştir ↗</button>
</div>
</div>
<div id="result"></div>
<footer>© 2026 IRCAI. IDEAS INTO REALITY.</footer>
</main>
<script>
function createIdea(){
const idea=document.getElementById('idea').value.trim();
const result=document.getElementById('result');
if(!idea){alert('Lütfen önce fikrini yaz.');return;}
result.style.display='block';
result.textContent='Fikir alındı!\n\n'+idea+'\n\nIRCAI proje geliştirme alanına hoş geldin. Yapay zekâ bağlantısı bir sonraki geliştirme aşamasında eklenecek.';
}
</script>
</body>
</html>
