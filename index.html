
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOZRA">

<title>TOZRA — Creative Intelligence</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23222220'/%3E%3Cpath d='M25 30h50M50 30v42M36 72h28' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">

<style>
:root {
  --bg: #f7f7f5;
  --white: #ffffff;
  --text: #20201f;
  --muted: #858580;
  --border: #e9e9e5;
  --accent: #222220;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100%;
  width: 100%;
}

.sidebar {
  width: 255px;
  flex-shrink: 0;
  background: #fff;
  border-right: 1px solid var(--border);
  padding: 25px 18px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 3px 5px 30px;
}

.logo {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  display: block;
}

.brand-name {
  font-size: 19px;
  font-weight: 750;
  letter-spacing: 1.5px;
}

.brand-subtitle {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: .5px;
}

.new-chat {
  width: 100%;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 11px;
  padding: 13px;
  text-align: left;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}

.new-chat:hover {
  background: var(--bg);
}

.sidebar-bottom {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding-top: 18px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.topbar {
  height: 66px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  background: rgba(255,255,255,.55);
}

.top-title {
  font-size: 13px;
  font-weight: 600;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #55a878;
}

.mobile-brand {
  display: none;
}

.chat-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 35px 20px 25px;
  scroll-behavior: smooth;
}

.chat-inner {
  max-width: 760px;
  width: 100%;
  margin: 0 auto;
}

.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px 0 50px;
}

.welcome-logo {
  width: 70px;
  height: 70px;
  display: block;
  margin-bottom: 25px;
}

.welcome h1 {
  font-size: clamp(25px, 5vw, 34px);
  letter-spacing: -1px;
  font-weight: 650;
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
  margin-top: 12px;
  line-height: 1.6;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 550px;
  margin-top: 38px;
}

.suggestion {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 15px;
  text-align: left;
  cursor: pointer;
  transition: .2s;
}

.suggestion:hover {
  border-color: #c8c8c2;
  transform: translateY(-2px);
}

.suggestion strong {
  font-size: 12px;
  display: block;
  margin-bottom: 6px;
}

.suggestion span {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
}

.message {
  display: flex;
  gap: 13px;
  margin-bottom: 28px;
  align-items: flex-start;
}

.message.user {
  justify-content: flex-end;
}

.message-icon {
  width: 31px;
  height: 31px;
  flex-shrink: 0;
  border-radius: 10px;
  background: #222220;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}

.message-content {
  max-width: 85%;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .message-content {
  background: #ecece8;
  border-radius: 15px 15px 3px 15px;
  padding: 12px 16px;
}

.assistant .message-content {
  padding: 3px 0;
}

.message-actions {
  margin-top: 12px;
}

.copy-btn {
  border: 1px solid var(--border);
  background: #fff;
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 10px;
  color: var(--muted);
  cursor: pointer;
}

.typing {
  display: flex;
  gap: 5px;
  padding: 12px 5px;
}

.typing span {
  width: 6px;
  height: 6px;
  background: #999;
  border-radius: 50%;
  animation: pulse 1s infinite alternate;
}

.typing span:nth-child(2) {
  animation-delay: .2s;
}

.typing span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes pulse {
  to { opacity: .25; transform: translateY(-3px); }
}

.composer-area {
  flex-shrink: 0;
  padding: 15px 20px 20px;
  background: linear-gradient(transparent, var(--bg) 20%);
}

.composer {
  max-width: 760px;
  margin: auto;
  background: #fff;
  border: 1px solid #e4e4df;
  border-radius: 17px;
  padding: 10px 12px 10px 17px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.035);
}

.composer textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  font: inherit;
  font-size: 14px;
  line-height: 1.6;
  max-height: 150px;
  padding: 5px 0;
  color: var(--text);
}

.composer textarea::placeholder {
  color: #aaa9a3;
}

.send-btn {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border: none;
  border-radius: 11px;
  background: #222220;
  color: #fff;
  cursor: pointer;
  font-size: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.send-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.footer-note {
  text-align: center;
  color: #a09f99;
  font-size: 10px;
  margin-top: 10px;
}

@media(max-width:700px) {
  .sidebar {
    display: none;
  }

  .topbar {
    height: 58px;
    padding: 0 17px;
  }

  .mobile-brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .mobile-brand .logo {
    width: 27px;
    height: 27px;
  }

  .mobile-brand span {
    font-size: 15px;
    font-weight: 750;
    letter-spacing: 1px;
  }

  .top-title {
    display: none;
  }

  .chat-area {
    padding: 25px 17px;
  }

  .welcome {
    padding-top: 35px;
  }

  .welcome-logo {
    width: 62px;
    height: 62px;
  }

  .suggestions {
    grid-template-columns: 1fr;
    margin-top: 28px;
  }

  .composer-area {
    padding: 10px 12px max(13px, env(safe-area-inset-bottom));
  }

  .message-content {
    max-width: 90%;
  }
}
</style>
</head>

<body>

<!-- TOZRA LOGO -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="tozra-mark" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="25" fill="#222220"/>
    <path d="M25 30H75 M50 30V72 M36 72H64"
      fill="none"
      stroke="#ffffff"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"/>
    <circle cx="50" cy="18" r="4" fill="#ffffff"/>
  </symbol>
</svg>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100" aria-label="TOZRA logo">
        <use href="#tozra-mark"/>
      </svg>
      <div>
        <div class="brand-name">TOZRA</div>
        <div class="brand-subtitle">CREATIVE INTELLIGENCE</div>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ &nbsp; Yeni sohbet
    </button>

    <div class="sidebar-bottom">
      TOZRA<br>
      Creative Intelligence<br>
      <span>Version 1.0</span>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="mobile-brand">
        <svg class="logo" viewBox="0 0 100 100" aria-label="TOZRA logo">
          <use href="#tozra-mark"/>
        </svg>
        <span>TOZRA</span>
      </div>

      <div class="top-title">Creative Intelligence</div>

      <div class="status">
        <span class="status-dot"></span>
        Online
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="chat-inner">

        <div class="welcome" id="welcome">

          <svg class="welcome-logo" viewBox="0 0 100 100" aria-label="TOZRA Logo">
            <use href="#tozra-mark"/>
          </svg>

          <h1>Fikrini keşfet.</h1>

          <p>
            Merhaba, ben TOZRA.<br>
            Fikirlerini birlikte geliştirelim.
          </p>

          <div class="suggestions">

            <button class="suggestion" onclick="useSuggestion('Bana yaratıcı bir proje fikri üret.')">
              <strong>✦ Yaratıcı fikirler</strong>
              <span>Yeni fikirler ve özgün projeler keşfet.</span>
            </button>

            <button class="suggestion" onclick="useSuggestion('Bir içerik üretim planı hazırla.')">
              <strong>◈ İçerik üretimi</strong>
              <span>Sosyal medya için içerik planı oluştur.</span>
            </button>

            <button class="suggestion" onclick="useSuggestion('Yeni bir marka oluşturmak istiyorum. Bana yardımcı ol.')">
              <strong>◇ Marka oluştur</strong>
              <span>Markanı fikirden projeye dönüştür.</span>
            </button>

            <button class="suggestion" onclick="useSuggestion('Bana yeni bir dijital proje öner.')">
              <strong>⌘ Dijital projeler</strong>
              <span>Yeni dijital projeler tasarla.</span>
            </button>

          </div>
        </div>

        <div id="messages"></div>

      </div>
    </section>

    <div class="composer-area">
      <div class="composer">
        <textarea
          id="prompt"
          rows="1"
          placeholder="TOZRA'ya bir şey sor..."
          onkeydown="handleKey(event)"
          oninput="resizeInput(this)"
        ></textarea>

        <button
          class="send-btn"
          id="sendBtn"
          onclick="sendMessage()"
          aria-label="Gönder"
        >↑</button>
      </div>

      <div class="footer-note">
        TOZRA can make mistakes. Check important information.
      </div>
    </div>

  </main>
</div>

<script>
let history = [];
let isLoading = false;

const promptInput = document.getElementById("prompt");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const sendBtn = document.getElementById("sendBtn");
const chatArea = document.getElementById("chatArea");

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function resizeInput(element) {
  element.style.height = "auto";
  element.style.height = Math.min(element.scrollHeight, 150) + "px";
}

function handleKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function useSuggestion(text) {
  promptInput.value = text;
  sendMessage();
}

function addMessage(role, text) {
  welcome.style.display = "none";

  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  if (role === "assistant") {
    const icon = document.createElement("div");
    icon.className = "message-icon";
    icon.textContent = "T";
    wrapper.appendChild(icon);
  }

  const content = document.createElement("div");
  content.className = "message-content";
  content.textContent = text;

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.className = "copy-btn";
    copy.textContent = "Kopyala";
    copy.onclick = () => copyText(text);

    actions.appendChild(copy);
    content.appendChild(actions);
  }

  wrapper.appendChild(content);
  messages.appendChild(wrapper);

  requestAnimationFrame(scrollToBottom);

  return wrapper;
}

function showTyping() {
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";
  wrapper.id = "typing";

  const icon = document.createElement("div");
  icon.className = "message-icon";
  icon.textContent = "T";

  const dots = document.createElement("div");
  dots.className = "typing";
  dots.innerHTML = "<span></span><span></span><span></span>";

  wrapper.appendChild(icon);
  wrapper.appendChild(dots);
  messages.appendChild(wrapper);

  scrollToBottom();
}

async function sendMessage() {
  const prompt = promptInput.value.trim();

  if (!prompt || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;

  promptInput.value = "";
  promptInput.style.height = "auto";

  addMessage("user", prompt);
  showTyping();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt,
        history: history
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Sunucudan geçerli yanıt alınamadı.");
    }

    document.getElementById("typing")?.remove();

    if (!response.ok) {
      throw new Error(data.error || "Sunucu isteği başarısız oldu.");
    }

    if (!data.answer) {
      throw new Error(data.error || "Yanıt alınamadı.");
    }

    const answer = data.answer;

    history.push({ role: "user", content: prompt });
    history.push({ role: "assistant", content: answer });

    addMessage("assistant", answer);

  } catch (error) {
    document.getElementById("typing")?.remove();

    addMessage(
      "assistant",
      "Bir hata oluştu: " + error.message +
      "\n\nLütfen bağlantını kontrol edip tekrar dene."
    );

  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    promptInput.focus();
  }
}

function newChat() {
  history = [];
  messages.innerHTML = "";
  welcome.style.display = "flex";
  promptInput.value = "";
  promptInput.style.height = "auto";
  promptInput.focus();
  scrollToBottom();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (error) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .catch(error => console.error("TOZRA:", error));
  });
}
</script>

</body>
</html>
