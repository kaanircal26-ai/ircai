
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOZRA">

<title>TOZRA — Creative Intelligence</title>

<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo.svg">
<link rel="manifest" href="/manifest.json">

<style>
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --text: #171717;
  --muted: #858585;
  --border: #e9e9e6;
  --accent: #171717;
  --sidebar: 260px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

button, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
  width: var(--sidebar);
  background: #fff;
  border-right: 1px solid var(--border);
  padding: 25px 18px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px;
  margin-bottom: 38px;
}

.brand img {
  width: 36px;
  height: 36px;
}

.brand-name {
  font-size: 19px;
  font-weight: 750;
  letter-spacing: 2px;
}

.brand-sub {
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--muted);
  margin-top: 3px;
}

.new-chat {
  width: 100%;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 12px;
  padding: 13px;
  text-align: left;
  font-size: 13px;
  font-weight: 600;
  transition: .2s;
}

.new-chat:hover {
  background: #f7f7f5;
}

.sidebar-label {
  color: #aaa;
  font-size: 10px;
  letter-spacing: 1.5px;
  margin: 30px 8px 12px;
  text-transform: uppercase;
}

.sidebar-info {
  margin-top: auto;
  padding: 15px 9px 0;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

/* MAIN */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  height: 70px;
  padding: 0 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,.7);
}

.topbar-title {
  font-size: 13px;
  font-weight: 600;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}

.status-dot {
  width: 7px;
  height: 7px;
  background: #54a77a;
  border-radius: 50%;
}

/* CHAT */

.chat-area {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 55px 30px 25px;
  display: flex;
  flex-direction: column;
}

.welcome {
  margin: auto 0;
  text-align: center;
  padding: 30px 0;
}

.welcome-logo {
  width: 65px;
  height: 65px;
  margin-bottom: 25px;
}

.welcome h1 {
  font-size: clamp(27px, 5vw, 39px);
  letter-spacing: -1.5px;
  margin: 0 0 12px;
  font-weight: 650;
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  margin: 0;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 540px;
  margin: 34px auto 0;
}

.suggestion {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 15px;
  text-align: left;
  color: #444;
  font-size: 12px;
  line-height: 1.5;
  transition: .2s;
}

.suggestion:hover {
  border-color: #aaa;
  transform: translateY(-2px);
}

/* MESSAGES */

.messages {
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-bottom: 25px;
}

.message {
  display: flex;
  gap: 13px;
  align-items: flex-start;
  animation: appear .25s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  justify-content: flex-end;
}

.message-icon {
  width: 31px;
  height: 31px;
  border-radius: 10px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  background: #171717;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}

.message-content {
  max-width: 78%;
  min-width: 0;
}

.message.user .message-content {
  background: #ededeb;
  border-radius: 15px 4px 15px 15px;
  padding: 13px 16px;
}

.message.assistant .message-content {
  padding: 5px 0;
  line-height: 1.75;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user .message-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.65;
}

.message-actions {
  margin-top: 8px;
}

.copy-btn {
  border: 0;
  background: transparent;
  color: #999;
  font-size: 11px;
  padding: 4px 0;
}

.copy-btn:hover {
  color: #222;
}

/* COMPOSER */

.composer-wrap {
  position: sticky;
  bottom: 0;
  background: var(--bg);
  padding: 15px 0 12px;
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  background: #fff;
  border: 1px solid #dededb;
  border-radius: 17px;
  padding: 12px 13px 12px 17px;
  box-shadow: 0 5px 25px rgba(0,0,0,.035);
}

.composer textarea {
  flex: 1;
  border: 0;
  outline: 0;
  resize: none;
  min-height: 27px;
  max-height: 150px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  background: transparent;
}

.composer textarea::placeholder {
  color: #aaa;
}

.send-btn {
  width: 37px;
  height: 37px;
  border: 0;
  border-radius: 11px;
  background: #171717;
  color: #fff;
  font-size: 17px;
  flex-shrink: 0;
  transition: .2s;
}

.send-btn:hover {
  background: #444;
}

.send-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  font-size: 10px;
  color: #aaa;
  margin-top: 10px;
}

/* LOADING */

.typing {
  display: flex;
  gap: 5px;
  padding: 10px 0;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #aaa;
  animation: pulse 1s infinite alternate;
}

.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes pulse {
  from { opacity: .3; transform: translateY(0); }
  to { opacity: 1; transform: translateY(-4px); }
}

/* SPLASH */

.splash {
  position: fixed;
  inset: 0;
  background: #f7f7f5;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transition: opacity .5s ease, visibility .5s ease;
}

.splash.hide {
  opacity: 0;
  visibility: hidden;
}

.splash img {
  width: 76px;
  height: 76px;
  margin-bottom: 18px;
}

.splash-name {
  font-size: 25px;
  font-weight: 750;
  letter-spacing: 5px;
}

.splash-sub {
  font-size: 9px;
  letter-spacing: 3px;
  color: #888;
  margin-top: 8px;
}

/* MOBILE */

.mobile-brand {
  display: none;
}

@media (max-width: 700px) {
  .sidebar {
    display: none;
  }

  .topbar {
    height: 60px;
    padding: 0 18px;
  }

  .mobile-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 750;
    letter-spacing: 1.5px;
    font-size: 14px;
  }

  .mobile-brand img {
    width: 28px;
    height: 28px;
  }

  .chat-area {
    padding: 30px 17px 15px;
  }

  .welcome {
    padding: 20px 0;
  }

  .welcome-logo {
    width: 54px;
    height: 54px;
  }

  .suggestions {
    grid-template-columns: 1fr;
    margin-top: 25px;
  }

  .suggestion {
    padding: 13px;
  }

  .message-content {
    max-width: 88%;
  }

  .composer-wrap {
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }

  .disclaimer {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<div class="splash" id="splash">
  <img src="/logo.svg" alt="TOZRA">
  <div class="splash-name">TOZRA</div>
  <div class="splash-sub">CREATIVE INTELLIGENCE</div>
</div>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <img src="/logo.svg" alt="TOZRA">
      <div>
        <div class="brand-name">TOZRA</div>
        <div class="brand-sub">CREATIVE INTELLIGENCE</div>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      + &nbsp; Yeni sohbet
    </button>

    <div class="sidebar-label">Çalışma alanı</div>

    <div class="sidebar-info">
      TOZRA<br>
      Creative Intelligence<br><br>
      Fikirlerini geliştir.
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="mobile-brand">
        <img src="/logo.svg" alt="TOZRA">
        TOZRA
      </div>

      <div class="topbar-title">Yapay zekâ asistanı</div>

      <div class="status">
        <span class="status-dot"></span>
        Hazır
      </div>
    </header>

    <section class="chat-area">

      <div class="welcome" id="welcome">
        <img class="welcome-logo" src="/logo.svg" alt="TOZRA">

        <h1>Fikrini geliştirmeye başla.</h1>

        <p>
          Düşüncelerini projelere dönüştür.<br>
          TOZRA ile üretmeye başla.
        </p>

        <div class="suggestions">
          <button class="suggestion" onclick="useSuggestion('Bana yaratıcı bir proje fikri üret.')">
            ✦ Yaratıcı proje fikirleri
          </button>

          <button class="suggestion" onclick="useSuggestion('Bir içerik üretim planı hazırla.')">
            ◇ İçerik üretim planı
          </button>

          <button class="suggestion" onclick="useSuggestion('Yeni bir marka oluşturmak istiyorum. Bana yardımcı ol.')">
            ▢ Marka geliştirme
          </button>

          <button class="suggestion" onclick="useSuggestion('Bana yeni ve özgün bir iş fikri öner.')">
            ↗ Yeni fikirler keşfet
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea
            id="prompt"
            placeholder="TOZRA'ya bir şey sor..."
            rows="1"
            oninput="resizeInput(this)"
            onkeydown="handleKey(event)"
          ></textarea>

          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            ↑
          </button>
        </div>

        <div class="disclaimer">
          TOZRA yapay zekâ tarafından oluşturulan yanıtlar sunar.
        </div>
      </div>

    </section>
  </main>
</div>

<script>
let history = [];
let isLoading = false;

const promptInput = document.getElementById("prompt");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const sendBtn = document.getElementById("sendBtn");

window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("splash").classList.add("hide");
  }, 1100);
});

function resizeInput(element) {
  element.style.height = "auto";
  element.style.height = Math.min(element.scrollHeight, 150) + "px";
}

function handleKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function useSuggestion(text) {
  promptInput.value = text;
  sendMessage();
}

function addMessage(role, text) {
  welcome.style.display = "none";

  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const content = document.createElement("div");
  content.className = "message-content";
  content.textContent = text;

  if (role === "assistant") {
    const icon = document.createElement("div");
    icon.className = "message-icon";
    icon.textContent = "T";
    wrapper.appendChild(icon);

    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.className = "copy-btn";
    copy.textContent = "Kopyala";
    copy.onclick = () => copyText(text);

    actions.appendChild(copy);
    content.appendChild(actions);
  }

  wrapper.appendChild(content);
  messages.appendChild(wrapper);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

  return wrapper;
}

function showTyping() {
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";
  wrapper.id = "typing";

  const icon = document.createElement("div");
  icon.className = "message-icon";
  icon.textContent = "T";

  const dots = document.createElement("div");
  dots.className = "typing";
  dots.innerHTML = "<span></span><span></span><span></span>";

  wrapper.appendChild(icon);
  wrapper.appendChild(dots);
  messages.appendChild(wrapper);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

async function sendMessage() {
  const prompt = promptInput.value.trim();

  if (!prompt || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;

  promptInput.value = "";
  promptInput.style.height = "27px";

  addMessage("user", prompt);
  showTyping();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt,
        history: history
      })
    });

    const data = await response.json();

    document.getElementById("typing")?.remove();

    if (!response.ok) {
      throw new Error(data.error || "Sunucu isteği başarısız oldu.");
    }

    if (!data.answer) {
      throw new Error(data.error || "Yanıt alınamadı.");
    }

    const answer = data.answer;

    history.push({
      role: "user",
      content: prompt
    });

    history.push({
      role: "assistant",
      content: answer
    });

    addMessage("assistant", answer);

  } catch (error) {
    document.getElementById("typing")?.remove();

    addMessage(
      "assistant",
      "Bir hata oluştu: " + error.message +
      "\n\nLütfen bağlantını kontrol edip tekrar dene."
    );

  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    promptInput.focus();
  }
}

function newChat() {
  history = [];
  messages.innerHTML = "";
  welcome.style.display = "block";
  promptInput.value = "";
  promptInput.style.height = "27px";
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (error) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
}

// PWA SERVICE WORKER
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .catch(error => console.error("TOZRA:", error));
  });
}
</script>

</body>
</html>
